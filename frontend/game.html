<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Play a live rapid chess game on Castleline."><title>Live game | Castleline</title><link rel="stylesheet" href="styles.css"></head>
<body class="game-page">
    <header class="game-header"><a href="home.html" class="wordmark">castleline <b>/</b> chess</a><div class="header-actions"><span class="user-chip" id="user-name">Player</span><button class="logout-button" id="logout" type="button">Sign out</button></div></header>
    <main class="game-layout">
        <section><div class="game-intro"><div><p>Rated rapid · 10 min</p><h1>Open board</h1></div><span class="game-status" id="game-status" aria-live="polite">Connecting</span></div><div class="board-wrap"><div id="board" class="board" aria-label="Chess board"></div></div></section>
        <aside class="side-panel"><div class="opponent-card"><div class="avatar">♞</div><div><div class="opponent-label">Opponent</div><div class="opponent-name">Searching...</div></div><div class="timer">10:00</div></div><div class="side-section"><p class="side-label">Match status</p><div id="match-status" class="match-status">Connecting to the arena...</div></div><div class="side-section"><p class="side-label">Moves</p><div id="moves" class="moves"><div class="move-row"><span>—</span><span>Waiting</span></div></div></div><div class="side-actions"><button id="new-game" type="button" class="secondary-button">Find new game</button><button type="button" class="secondary-button" onclick="window.location.href='home.html'">Exit</button></div></aside>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div><script src="app.js"></script>
</body>
</html>
